# This file configures the deployment of your FastAPI backend on Render.
# It defines the web service, its build, and start commands.

services:
  # Define the web service for your FastAPI application
  - type: web
    name: ai-business-operations-manager-backend
    env: python # Specifies the runtime environment
    region: singapore # Choose a region close to your users or data
    plan: free # Or choose a paid plan for more resources (e.g., starter, standard)
    
    # Build configuration
    build:
      # Command to install dependencies
      # Use --no-cache-dir for smaller Docker images
      command: pip install --no-cache-dir -r requirements.txt
    
    # Start command for the web service
    # This command starts the Uvicorn server, which runs the FastAPI application.
    # The 'app.main:app' points to the FastAPI app instance in app/main.py.
    # Bind to 0.0.0.0 to be accessible from outside the container.
    # Use a port number provided by Render via the PORT environment variable.
    start_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Environment variables configuration
    # These should ideally be set directly in Render's environment settings
    # for security and ease of management. .env.example is for local dev.
    env_vars:
      - key: DATABASE_URL # Example: Postgres connection string for Supabase
        from_secret: SUPABASE_DATABASE_URL # Assuming SUPABASE_DATABASE_URL is set in Render secrets
      - key: OPENAI_API_KEY
        from_secret: OPENAI_API_KEY
      - key: SUPABASE_URL
        from_secret: SUPABASE_URL
      - key: SUPABASE_KEY
        from_secret: SUPABASE_KEY # Anon key if needed client-side, otherwise service role key
      - key: SUPABASE_SERVICE_ROLE_KEY
        from_secret: SUPABASE_SERVICE_ROLE_KEY
      - key: JWT_SECRET
        from_secret: JWT_SECRET
      - key: SECRET_KEY
        from_secret: SECRET_KEY # FastAPI's secret key for session management if used
      - key: DEBUG
        value: "False" # Set to False for production
      - key: LOG_LEVEL
        value: "INFO" # Adjust log level as needed for production
      # Add other environment variables as required
      
    # Auto-deploy from a Git branch
    # auto_deploy:
    #   branch: main # Or your main development branch

    # Health check configuration
    health_check_path: /api/v1/health # Path to your health check endpoint
    health_check_timeout: 30 # Timeout in seconds
    health_check_interval: 30 # Interval in seconds
    health_check_threshold: 3 # Number of successful checks required to mark as healthy

